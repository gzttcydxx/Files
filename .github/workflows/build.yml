name: Build Files Project

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.200'
  WINDOWS_SDK_VERSION: '10.0.22621.0'
  WINDOWS_APP_SDK_VERSION: '1.8'

jobs:
  build:
    runs-on: windows-2022
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, x86, ARM64]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache MSBuild
      uses: actions/cache@v4
      with:
        path: |
          ~/.msbuild
          **/bin
          **/obj
        key: ${{ runner.os }}-msbuild-${{ matrix.platform }}-${{ matrix.configuration }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: |
          ${{ runner.os }}-msbuild-${{ matrix.platform }}-${{ matrix.configuration }}-
          ${{ runner.os }}-msbuild-${{ matrix.platform }}-
          ${{ runner.os }}-msbuild-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Install Windows SDK
      shell: powershell
      run: |
        # 安装 Windows 11 SDK
        $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196127"
        $sdkInstaller = "$env:TEMP\winsdksetup.exe"
        
        Write-Host "Downloading Windows SDK..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkInstaller
        
        Write-Host "Installing Windows SDK..."
        Start-Process -FilePath $sdkInstaller -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDesktopDebuggers", "OptionId.WindowsDesktopSoftwareDevelopmentKit" -Wait
        
        Write-Host "Windows SDK installation completed"

    - name: Install Windows App SDK
      shell: powershell
      run: |
        # 安装 Windows App SDK
        Write-Host "Installing Windows App SDK ${{ env.WINDOWS_APP_SDK_VERSION }}..."
        
        # 通过 NuGet 安装 Windows App SDK
        dotnet tool install --global Microsoft.WindowsAppSDK.ProjectReunion.Tools --version ${{ env.WINDOWS_APP_SDK_VERSION }}
        
        # 或者通过直接下载安装包
        $appSdkUrl = "https://aka.ms/windowsappsdk/1.8/1.8.240802000/windowsappruntimeinstall-x64.exe"
        $appSdkInstaller = "$env:TEMP\windowsappruntimeinstall.exe"
        
        Invoke-WebRequest -Uri $appSdkUrl -OutFile $appSdkInstaller
        Start-Process -FilePath $appSdkInstaller -ArgumentList "/quiet" -Wait
        
        Write-Host "Windows App SDK installation completed"

    - name: Install Visual Studio Build Tools Components
      shell: powershell
      run: |
        # 安装必要的 Visual Studio 组件
        $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        
        if (Test-Path $vsInstaller) {
          Write-Host "Installing additional VS components..."
          & $vsInstaller modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --add Microsoft.VisualStudio.Component.Windows11SDK.22621 `
            --quiet --wait
        } else {
          Write-Host "Visual Studio installer not found, components should be pre-installed"
        }

    - name: Restore NuGet packages
      run: |
        dotnet restore Files.slnx --verbosity normal

    - name: Build solution
      run: |
        msbuild Files.slnx `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:AppxBundlePlatforms="${{ matrix.platform }}" `
          /p:AppxPackageDir="${{ github.workspace }}\AppPackages\" `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always `
          /verbosity:normal `
          /maxcpucount

    - name: Run tests (if available)
      continue-on-error: true
      run: |
        dotnet test Files.slnx --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger trx --results-directory TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.platform }}-${{ matrix.configuration }}
        path: TestResults/*.trx

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Files-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          AppPackages/**/*
          **/bin/${{ matrix.configuration }}/**/*
        retention-days: 30

    - name: Upload symbols (Release only)
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: Files-Symbols-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          **/bin/${{ matrix.configuration }}/**/*.pdb
        retention-days: 90

  package:
    needs: build
    runs-on: windows-2022
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release package
      shell: powershell
      run: |
        $releaseDir = "release-package"
        New-Item -ItemType Directory -Path $releaseDir -Force
        
        # 复制所有构建产物到发布目录
        Get-ChildItem -Path "artifacts" -Recurse -Include "*.msix", "*.appx", "*.msixbundle", "*.appxbundle" | 
          Copy-Item -Destination $releaseDir
        
        # 创建版本信息文件
        $versionInfo = @{
          "BuildDate" = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          "CommitSha" = "${{ github.sha }}"
          "Branch" = "${{ github.ref_name }}"
          "Workflow" = "${{ github.run_number }}"
        } | ConvertTo-Json
        
        $versionInfo | Out-File -FilePath "$releaseDir\build-info.json" -Encoding UTF8

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: Files-Release-Package
        path: release-package/**/*
        retention-days: 90

  cleanup:
    needs: [build, package]
    runs-on: windows-2022
    if: always()
    
    steps:
    - name: Cleanup old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          // 保留最近的构建产物，删除过期的
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - 30);
          
          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < cutoffDate && !artifact.name.includes('Release')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
          }
