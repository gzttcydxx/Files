name: Build Windows EXE

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      PROJECT_PATH: src/Files.App/Files.App.csproj
      CONFIGURATION: Release
      RUNTIME_ID: win-x64
      PLATFORM: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}" --verbosity minimal

      - name: Publish (Windows x64)
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c "${{ env.CONFIGURATION }}" `
            -r "${{ env.RUNTIME_ID }}" `
            -p:Platform="${{ env.PLATFORM }}" `
            --no-restore

      - name: Upload EXE publish output
        uses: actions/upload-artifact@v4
        with:
          name: Files-${{ env.RUNTIME_ID }}-${{ env.CONFIGURATION }}
          path: |
            src/Files.App/bin/${{ env.CONFIGURATION }}/*/${{ env.RUNTIME_ID }}/publish/**
            src/Files.App/bin/${{ env.CONFIGURATION }}/*/${{ env.RUNTIME_ID }}/publish/Files.exe
          retention-days: 30
