name: Build Windows EXE

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    env:
      PROJECT_PATH: src/Files.App/Files.App.csproj
      CONFIGURATION: Release
      RUNTIME_ID: win-x64
      PLATFORM: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Use Windows SDK Preview
        shell: cmd
        run: |
          for /f %%a in ('dir /b /a:d %localappdata%\Microsoft\VisualStudio\17*') do echo UsePreviews=True>%localappdata%\Microsoft\VisualStudio\%%a\sdk.txt

      - name: Install Windows SDK
        shell: pwsh
        run: |
          $sdkUrl = "https://go.microsoft.com/fwlink/?linkid=2196127"
          $sdkInstaller = "$env:TEMP\winsdksetup.exe"

          Write-Host "Downloading Windows SDK..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkInstaller

          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $sdkInstaller -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDesktopDebuggers", "OptionId.WindowsDesktopSoftwareDevelopmentKit" -Wait

          Write-Host "Windows SDK installation completed"

      - name: Install Windows App SDK
        shell: pwsh
        run: |
          Write-Host "Installing Windows App SDK 1.8..."

          dotnet tool install --global Microsoft.WindowsAppSDK.ProjectReunion.Tools --version 1.8

          $appSdkUrl = "https://aka.ms/windowsappsdk/1.8/1.8.240802000/windowsappruntimeinstall-x64.exe"
          $appSdkInstaller = "$env:TEMP\windowsappruntimeinstall.exe"

          Invoke-WebRequest -Uri $appSdkUrl -OutFile $appSdkInstaller
          Start-Process -FilePath $appSdkInstaller -ArgumentList "/quiet" -Wait

          Write-Host "Windows App SDK installation completed"

      - name: Install Visual Studio Build Tools Components
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          if (Test-Path $vsInstaller) {
            Write-Host "Installing additional VS components..."
            & $vsInstaller modify --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
              --add Microsoft.VisualStudio.Component.VC.ATL `
              --add Microsoft.VisualStudio.Component.Windows11SDK.22621 `
              --quiet --wait
          } else {
            Write-Host "Visual Studio installer not found, components should be pre-installed"
          }

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}" --verbosity minimal

      - name: Build Files.App.Server (generate WinMD)
        run: |
          dotnet build "src/Files.App.Server/Files.App.Server.csproj" `
            -c "${{ env.CONFIGURATION }}" `
            -r "${{ env.RUNTIME_ID }}" `
            -p:Platform="${{ env.PLATFORM }}"

      - name: Publish (Windows x64)
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c "${{ env.CONFIGURATION }}" `
            -r "${{ env.RUNTIME_ID }}" `
            -p:Platform="${{ env.PLATFORM }}" `
            --no-restore

      - name: Upload EXE publish output
        uses: actions/upload-artifact@v4
        with:
          name: Files-${{ env.RUNTIME_ID }}-${{ env.CONFIGURATION }}
          path: |
            src/Files.App/bin/${{ env.CONFIGURATION }}/*/${{ env.RUNTIME_ID }}/publish/**
            src/Files.App/bin/${{ env.CONFIGURATION }}/*/${{ env.RUNTIME_ID }}/publish/Files.exe
          retention-days: 30
